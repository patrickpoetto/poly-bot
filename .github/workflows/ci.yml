name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dashboard,postgres]"
      - name: Lint
        run: ruff check src tests
      - name: Type-check
        run: mypy src/poly_bot
      - name: Tests
        run: pytest -q
