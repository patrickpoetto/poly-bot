[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poly-bot"
version = "0.3.0"
description = "BTC 5m trade-confirmed paper trading strategy — research scripts + live paper trader"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Patrick Poetto" }]
dependencies = [
    "httpx[http2]>=0.28.0",
    "websockets>=14.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pandas-stubs>=2.2.0",
    "pytest>=8.0.0",
]

# No src/ package layout — every script in the repo root is self-contained
# and run directly (see README "Running it" / CLAUDE.md). `pip install -e
# ".[dev]"` only needs to resolve dependencies, not package anything.
[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "ASYNC", "S",
]
ignore = ["S101", "SIM108"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
