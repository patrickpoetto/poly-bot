# Weather-only stack — minimal outbound traffic.
#
#   docker compose --env-file .env -f docker/docker-compose.weather.yml up -d
#
# Includes: postgres + dashboard (prices via REST on /weather/event only).
# Does NOT start: discovery, ws-daemon, catalog-watch, alerter, backup, reconcile.
#
# Refresh catalog (manual, one-shot — run when you need new cities/days):
#   ./docker/stack.sh sync-catalog
# Or: docker compose ... --profile discovery run --rm discovery poly-bot discovery serve --once
#     docker compose ... run --rm discovery poly-bot weather sync

x-poly-bot-base: &poly-bot-base
  image: ${POLY_BOT_IMAGE:-poly-bot:latest}
  build:
    context: ..
    dockerfile: docker/Dockerfile
  env_file:
    - ../.env
  environment:
    DATABASE_URL: postgresql+psycopg://poly_bot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/poly_bot
    POSTGRES_HOST: postgres
    POLY_BOT_ENV: production
    POLY_BOT_LOG_JSON: "true"
  networks:
    - backend
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: on-failure:5
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  read_only: true
  tmpfs:
    - /tmp
  user: "1000:1000"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poly_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: poly_bot
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poly_bot -d poly_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m

  migrate:
    <<: *poly-bot-base
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["poly-bot", "ops", "migrate"]

  dashboard:
    <<: *poly-bot-base
    environment:
      DATABASE_URL: postgresql+psycopg://poly_bot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/poly_bot
      CATALOG_DASHBOARD_HOST: "0.0.0.0"
      METRICS_ENABLED: "false"
      WEATHER_CATALOG_SYNC_ENABLED: "false"
    networks:
      - backend
      - frontend
    ports:
      - "${CATALOG_DASHBOARD_PORT:-8765}:8765"
    command: ["poly-bot", "catalog", "dashboard"]
    mem_limit: 384m
    cpus: 0.5

  # Optional one-shot / manual — not started by default
  discovery:
    <<: *poly-bot-base
    profiles: ["sync"]
    restart: "no"
    command: ["poly-bot", "discovery", "serve", "--once"]
    mem_limit: 768m

volumes:
  pg_data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
