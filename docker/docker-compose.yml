# Local dev compose — SQLite volume (no Postgres).
# For production stack see docker/docker-compose.prod.yml
services:
  poly-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    volumes:
      - poly_bot_data:/app/data
    restart: unless-stopped
    command: ["poly-bot", "run"]

  harvest-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    volumes:
      - poly_bot_data:/app/data
    restart: unless-stopped
    command: ["poly-bot", "harvest", "engine", "--paper"]
    profiles: ["engine"]

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    volumes:
      - poly_bot_data:/app/data
    ports:
      - "8765:8765"
    restart: unless-stopped
    command: ["poly-bot", "catalog", "dashboard"]
    profiles: ["dashboard"]

volumes:
  poly_bot_data:
