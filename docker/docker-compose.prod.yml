# Production stack — split services, healthchecks, restart policies, backup.
#
# Usage (from project root, so `.env` is auto-loaded):
#   cp .env.example .env   # set POSTGRES_PASSWORD, POLY_BOT_IMAGE
#
# Minimal / weather UI (low bandwidth — see docker/STACK.md):
#   docker compose --env-file .env -f docker/docker-compose.prod.yml up -d
#   → postgres + dashboard only
#
# Add services one at a time:
#   docker compose ... --profile discovery up -d discovery
#   docker compose ... --profile heavy up -d catalog-watch
#   docker compose ... --profile heavy up -d ws-daemon
#
# Full stack (heavy on network/RAM):
#   docker compose ... --profile discovery --profile heavy --profile ops up -d
#
# Services (no profile = always on with plain `up -d`):
#   postgres, migrate, dashboard
#
# Profiles:
#   discovery  — Gamma crawl (high bandwidth if serve)
#   heavy      — ws-daemon + catalog-watch (highest bandwidth)
#   ops        — backup, reconcile, alerter
#
# Image tag controlled by POLY_BOT_IMAGE (default: poly-bot:latest, built locally).

x-poly-bot-base: &poly-bot-base
  image: ${POLY_BOT_IMAGE:-poly-bot:latest}
  build:
    context: ..
    dockerfile: docker/Dockerfile
  env_file:
    - ../.env
  environment:
    DATABASE_URL: postgresql+psycopg://poly_bot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/poly_bot
    POSTGRES_HOST: postgres
    POSTGRES_USER: poly_bot
    POLY_BOT_ENV: production
    POLY_BOT_LOG_JSON: "true"
    METRICS_ENABLED: "true"
  networks:
    - backend
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: on-failure:5
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  read_only: true
  tmpfs:
    - /tmp
  user: "1000:1000"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poly_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: poly_bot
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poly_bot -d poly_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    <<: *poly-bot-base
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["poly-bot", "ops", "migrate"]

  discovery:
    <<: *poly-bot-base
    profiles: ["discovery"]
    command: ["poly-bot", "discovery", "serve"]
    healthcheck:
      test: ["CMD", "poly-bot", "ops", "health", "--service", "discovery", "--max-age", "900"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s
    mem_limit: 768m
    cpus: 1.0

  catalog-watch:
    <<: *poly-bot-base
    profiles: ["heavy"]
    command: ["poly-bot", "catalog", "watch"]
    environment:
      DATABASE_URL: postgresql+psycopg://poly_bot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/poly_bot
      POSTGRES_HOST: postgres
      POLY_BOT_ENV: production
      POLY_BOT_LOG_JSON: "true"
      METRICS_ENABLED: "true"
      CATALOG_WS_PERSISTENT: "true"  # so this loop skips WS (handled by ws-daemon)
    healthcheck:
      test: ["CMD", "poly-bot", "ops", "health", "--service", "watch", "--max-age", "600"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s
    mem_limit: 768m
    cpus: 1.0

  ws-daemon:
    <<: *poly-bot-base
    profiles: ["heavy"]
    command: ["poly-bot", "catalog", "ws-daemon"]
    healthcheck:
      test: ["CMD", "poly-bot", "ops", "health", "--service", "ws", "--max-age", "300"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    mem_limit: 384m
    cpus: 0.5

  weather-aviation:
    <<: *poly-bot-base
    profiles: ["weather"]
    command: ["poly-bot", "weather", "aviation-serve"]
    environment:
      DATABASE_URL: postgresql+psycopg://poly_bot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/poly_bot
      WEATHER_AVIATION_SYNC_ENABLED: "true"
      WEATHER_AVIATION_INTERVAL_SECONDS: "${WEATHER_AVIATION_INTERVAL_SECONDS:-900}"
    healthcheck:
      test: ["CMD", "poly-bot", "weather", "aviation-status"]
      interval: 120s
      timeout: 30s
      retries: 3
      start_period: 120s
    mem_limit: 256m
    cpus: 0.25

  weather-sync:
    <<: *poly-bot-base
    profiles: ["weather"]
    command: ["poly-bot", "weather", "serve"]
    environment:
      DATABASE_URL: postgresql+psycopg://poly_bot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/poly_bot
      WEATHER_MARKET_SYNC_ENABLED: "true"
      WEATHER_MARKET_SYNC_INTERVAL_SECONDS: "${WEATHER_MARKET_SYNC_INTERVAL_SECONDS:-180}"
      WEATHER_AVIATION_SYNC_ENABLED: "${WEATHER_AVIATION_SYNC_ENABLED:-true}"
    healthcheck:
      test: ["CMD", "poly-bot", "weather", "status"]
      interval: 120s
      timeout: 30s
      retries: 3
      start_period: 120s
    mem_limit: 512m
    cpus: 0.75

  dashboard:
    <<: *poly-bot-base
    environment:
      DATABASE_URL: postgresql+psycopg://poly_bot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/poly_bot
      POSTGRES_HOST: postgres
      POLY_BOT_ENV: production
      POLY_BOT_LOG_JSON: "true"
      METRICS_ENABLED: "true"
      CATALOG_DASHBOARD_HOST: "0.0.0.0"
    networks:
      - backend
      - frontend
    ports:
      - "${CATALOG_DASHBOARD_PORT:-8765}:8765"
    command: ["poly-bot", "catalog", "dashboard"]
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8765/health\",timeout=3).status==200 else 1)'"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 384m
    cpus: 0.5

  harvest-engine:
    <<: *poly-bot-base
    profiles: ["engine"]
    command: ["poly-bot", "harvest", "engine", "--paper"]
    environment:
      DATABASE_URL: postgresql+psycopg://poly_bot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/poly_bot
      POSTGRES_HOST: postgres
      POLY_BOT_ENV: production
      POLY_BOT_LOG_JSON: "true"
      PAPER_TRADING: "${PAPER_TRADING:-true}"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys; sys.exit(0)'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 384m
    cpus: 0.5
    restart: on-failure:5

  backup:
    <<: *poly-bot-base
    profiles: ["ops"]
    command:
      - "poly-bot"
      - "ops"
      - "backup-loop"
      - "--interval"
      - "${BACKUP_INTERVAL_SECONDS:-3600}"
      - "--retention-days"
      - "${BACKUP_RETENTION_DAYS:-7}"
      - "--dest"
      - "/backups"
    volumes:
      - pg_backups:/backups
    read_only: false
    mem_limit: 256m
    cpus: 0.25

  reconcile:
    <<: *poly-bot-base
    profiles: ["ops"]
    command:
      - "poly-bot"
      - "ops"
      - "reconcile-loop"
      - "--interval"
      - "${RECONCILE_INTERVAL_SECONDS:-3600}"
    healthcheck:
      test: ["CMD", "poly-bot", "ops", "health", "--service", "any", "--max-age", "7200"]
      interval: 5m
      timeout: 15s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    cpus: 0.25

  alerter:
    <<: *poly-bot-base
    profiles: ["ops"]
    command: ["poly-bot", "ops", "alerter-loop"]
    environment:
      DATABASE_URL: postgresql+psycopg://poly_bot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/poly_bot
      POSTGRES_HOST: postgres
      POLY_BOT_ENV: production
      POLY_BOT_LOG_JSON: "true"
      METRICS_ENABLED: "false"
      ALERTER_ENABLED: "${ALERTER_ENABLED:-true}"
    healthcheck:
      test: ["CMD", "poly-bot", "ops", "health", "--service", "any", "--max-age", "7200"]
      interval: 5m
      timeout: 15s
      retries: 3
      start_period: 30s
    mem_limit: 192m
    cpus: 0.25

volumes:
  pg_data:
  pg_backups:

networks:
  backend:
    driver: bridge
    internal: false  # need outbound for httpx → Polymarket APIs
  frontend:
    driver: bridge
